<style>

:root{

  --c-cond:#2a78d6; --c-sym:#eb6834; --c-blog:#1baf7a; --c-svc:#6250d6; --c-area:#e87ba4; --c-core:#008300; --c-broken:#c42f2f; --c-video:#e34948; --c-review:#eda100; --t-back:#2a78d6; --t-sciatica:#eb6834; --t-neck:#1baf7a; --t-migraine:#eda100; --t-prenatal:#e87ba4; --t-pediatric:#008300; --t-nervous:#6250d6; --t-sports:#e34948; --t-local:#5f7a82; --t-core:#9aa8ac; --t-x:#b9c3c6; --k0:#2a78d6; --k1:#eb6834; --k2:#1baf7a; --k3:#eda100; --k4:#e87ba4; --k5:#008300; --k6:#6250d6; --k7:#e34948;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --surface:#162226; --surface-2:#1d2c31; --line:#2b3d43; --ink:#e7eff0; --ink-2:#a9bbbf; --ink-3:#7f9499;

  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719; --surface:#162226; --surface-2:#1d2c31; --line:#2b3d43; --ink:#e7eff0; --ink-2:#a9bbbf; --ink-3:#7f9499;

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);display:flex;flex-direction:column;min-height:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.brand h1{margin:0;font:600 19px/1.1 var(--f-display);letter-spacing:.01em;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--ink-3);font-size:12px}
.tabs{display:flex;gap:2px;background:var(--surface-2);border-radius:8px;padding:3px}
.tabs button{border:0;background:none;padding:5px 12px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.search{flex:1 1 220px;max-width:340px;position:relative}
.search input{width:100%;box-sizing:border-box;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.sugg{position:absolute;z-index:20;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:300px;overflow:auto}
.sugg li{padding:6px 8px;border-radius:6px;cursor:pointer}
.sugg li[aria-selected="true"],.sugg li:hover{background:var(--surface-2)}
.sugg small{display:block;color:var(--ink-3);font:12px var(--f-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);font-size:13px}
.filters .lbl{color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 7px;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.chip svg{flex:none}
.chip b{font-weight:500;color:var(--ink)}
.chip .n{color:var(--ink-3);font-variant-numeric:tabular-nums}
.toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink-2)}
.toggle input{accent-color:var(--brand);margin:0}
.swatch-line{width:22px;height:0;border-top:2px solid var(--edge)}
.swatch-line.tpl{border-top-style:dotted}
.swatch-line.idx{border-top-style:dashed;opacity:.7}
.main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
.view{min-height:0;position:relative}
#map{position:relative;overflow:hidden;background:var(--bg)}
#svg{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#svg:active{cursor:grabbing}
.mapnote{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--ink-3);background:color-mix(in srgb,var(--bg) 80%,transparent);padding:2px 6px;border-radius:4px;pointer-events:none}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:32px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-size:16px;line-height:1}
.edge{fill:none;stroke:var(--edge);stroke-width:.8;stroke-opacity:.28}
.edge.tpl{stroke-dasharray:1.5 2.5}
.edge.idx{stroke-dasharray:5 3}
.edge.red{stroke:var(--warn);stroke-opacity:.45}
.edge.dead{stroke:var(--bad);stroke-opacity:.9;stroke-width:1.4}
.dim .edge{stroke-opacity:.04}
.dim .edge.out{stroke:var(--edge-hi);stroke-opacity:.85;stroke-width:1.4}
.dim .edge.in{stroke:var(--edge-in);stroke-opacity:.85;stroke-width:1.4}
.dim .edge.both{stroke:var(--edge-both);stroke-opacity:.95;stroke-width:1.8;stroke-dasharray:none}
.keylegend{position:absolute;left:12px;bottom:10px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);padding:5px 10px;border-radius:8px;pointer-events:none}
.keylegend span{display:inline-flex;align-items:center;gap:6px}
.keylegend i{display:inline-block;width:18px;height:0;border-top:2.5px solid}
.both-tag{color:var(--edge-both);font-weight:600}
.node path{stroke:var(--surface);stroke-width:1.5;cursor:pointer}
.node.sel path{stroke:var(--ink);stroke-width:2.5}
.node.hub-ring circle{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 2}
.dim .node{opacity:.15}
.dim .node.hl{opacity:1}
.label{font:500 11px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.label.small{font-size:10px;fill:var(--ink-2)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:280px;z-index:5}
.tip b{display:block;font-weight:600}
.tip span{color:var(--ink-3);font:11px var(--f-mono);word-break:break-all}
aside{border-left:1px solid var(--line);background:var(--surface);overflow:auto;min-height:0}
.pane{padding:16px 18px 28px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);margin:0}
h2{margin:0;font:600 20px/1.2 var(--f-display);text-wrap:balance}
h3{margin:0 0 6px;font:600 13px var(--f-body);display:flex;justify-content:space-between;gap:8px}
h3 .n{color:var(--ink-3);font-weight:500;font-variant-numeric:tabular-nums}
.path{font:12px var(--f-mono);color:var(--ink-2);word-break:break-all}
.path a{color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:8px;padding:8px 10px}
.stat .v{font:600 20px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat .k{font-size:11px;color:var(--ink-3);margin-top:3px;line-height:1.25}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);display:inline-flex;gap:5px;align-items:center}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{color:var(--ok)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{padding:6px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:12px minmax(0,1fr);gap:8px;align-items:start}
.list li:first-child{border-top:0}
.list button.lk{all:unset;cursor:pointer;color:var(--ink);font-weight:500;overflow-wrap:anywhere}
.list button.lk:hover{color:var(--brand);text-decoration:underline}
.list button.lk:focus-visible{outline:2px solid var(--brand)}
.list .meta{display:block;font-size:12px;color:var(--ink-3);overflow-wrap:anywhere}
.list .meta q{color:var(--ink-2)}
.more{all:unset;cursor:pointer;color:var(--brand);font-size:13px;margin-top:4px}
.empty{color:var(--ink-3);font-size:13px;margin:0}
.issue{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.issue.sev-bad{border-left:4px solid var(--bad)}
.issue.sev-warn{border-left:4px solid var(--warn)}
.issue.sev-info{border-left:4px solid var(--brand)}
.issue.sev-ok{border-left:4px solid var(--ok)}
.issue p{margin:0;color:var(--ink-2);max-width:65ch}
.issue h3{font-size:14px;margin:0}
details summary{cursor:pointer;color:var(--brand);font-size:13px}
#issuesView,#tableView{overflow:auto;background:var(--bg)}
.issues-wrap{max-width:900px;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.issues-wrap>p{margin:0;color:var(--ink-2);max-width:70ch}
.tbl-wrap{padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tbl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--surface-2);font-weight:600;font-size:12px;white-space:nowrap}
th button{all:unset;cursor:pointer}
th button:focus-visible{outline:2px solid var(--brand)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td .path{font-size:11px}
tr:hover td{background:var(--surface-2)}
tr.clickable{cursor:pointer}
.dot{display:inline-block;vertical-align:middle}
@media (max-width:860px){
  body{height:auto;min-height:100%}
  .main{grid-template-columns:1fr}
  #map{height:62vh;min-height:360px}
  aside{border-left:0;border-top:1px solid var(--line)}
  #issuesView,#tableView{min-height:60vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.seg{display:inline-flex;gap:2px;background:var(--surface-2);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:3px 10px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-weight:500;font-size:13px}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tdot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;vertical-align:middle}
.node.util{opacity:.38}
.node.util.hl,.node.util.sel{opacity:1}
.node.pillar .ring{fill:none;stroke:var(--ink);stroke-width:2}
.clabel{font:600 13px var(--f-display);letter-spacing:.02em;text-transform:uppercase;fill:var(--ink-2);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.dim .clabel{opacity:.25}
.shapekey{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.shapekey span{display:inline-flex;align-items:center;gap:4px}
.ctable{width:100%;border-collapse:collapse;font-size:13px;min-width:0}
.ctable th,.ctable td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.ctable th{background:none;position:static;font-size:11px;color:var(--ink-3);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.ctable td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctable .lk{font-weight:500}
.ctable .lk{all:unset;cursor:pointer;color:var(--ink);font-weight:500}
.ctable .lk:hover{color:var(--brand);text-decoration:underline}
.ctable .lk:focus-visible{outline:2px solid var(--brand)}
.subh{margin:10px 0 0;font-weight:600;display:flex;align-items:center;gap:6px}
.subh span{color:var(--ink-3);font-weight:400;font-size:13px}
.label.pil{font-size:14px;font-weight:600}
.ratio.low{color:var(--warn)}
.ratio.none{color:var(--ink-3)}
</style>
</head>
<body>



<header class="top">
  <div class="brand">
    <h1 id="brandName">Link Map</h1>
    <p id="subline"></p>
  </div>
  <div class="tabs" role="tablist" aria-label="View">
    <button role="tab" id="tab-map" aria-selected="true" data-view="map">Map</button>
    <button role="tab" id="tab-issues" aria-selected="false" data-view="issues">Issues <span id="issueCount"></span></button>
    <button role="tab" id="tab-table" aria-selected="false" data-view="table">All pages</button>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Find a page by name or URL" autocomplete="off" aria-label="Find a page" role="combobox" aria-expanded="false" aria-controls="sugg">
    <ul class="sugg" id="sugg" role="listbox" hidden></ul>
  </div>
</header>
<div class="filters" id="filters">
  <span class="lbl">Group by</span>
  <div class="seg" role="radiogroup" aria-label="Group pages by" id="modeSeg">
    <button type="button" role="radio" data-mode="topic" aria-checked="true">Topic</button>
    <button type="button" role="radio" data-mode="section" aria-checked="false">Section</button>
    <button type="button" role="radio" data-mode="links" aria-checked="false">Actual links</button>
  </div>
  <span id="groupChips" style="display:contents"></span>
  <span class="lbl" style="margin-left:6px">Links</span>
  <label class="toggle"><input type="checkbox" id="t-content" checked><span class="swatch-line"></span>Written into the page</label>
  <label class="toggle"><input type="checkbox" id="t-tpl"><span class="swatch-line tpl"></span>Template blocks</label>
  <label class="toggle"><input type="checkbox" id="t-idx" checked><span class="swatch-line idx"></span>Blog index</label>
  <label class="toggle"><input type="checkbox" id="t-util">Site-wide pages</label>
</div>
<div class="main">
  <div class="view" id="map">
    <svg id="svg" role="img" aria-label="Network map of internal links between pages, grouped into topic clusters"></svg>
    <div class="tip" id="tip" hidden></div>
    <div class="keylegend" id="keylegend" hidden><span><i style="border-color:var(--edge-hi)"></i>Links out</span><span><i style="border-color:var(--edge-in)"></i>Links in</span><span><i style="border-color:var(--edge-both)"></i>Both ways</span></div>
    <div class="mapnote" id="mapnote"></div>
    <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">&minus;</button><button id="zfit" aria-label="Fit map" style="font-size:12px">Fit</button></div>
  </div>
  <div class="view" id="issuesView" hidden><div class="issues-wrap" id="issues"></div></div>
  <div class="view" id="tableView" hidden><div class="tbl-wrap"><div class="tbl-scroll"><table id="tbl"></table></div></div></div>
  <aside id="panel" aria-live="polite"><div class="pane" id="pane"></div></aside>
</div>

/* ---------- link communities (grouping the link data finds on its own) ---------- */
function louvain(ids, wedges){
  const idx=new Map(ids.map((id,i)=>[id,i]));
  let level=ids.map(()=>new Map());
  wedges.forEach(([a,b,w])=>{const i=idx.get(a),j=idx.get(b); if(i===undefined||j===undefined||i===j) return; level[i].set(j,(level[i].get(j)||0)+w); level[j].set(i,(level[j].get(i)||0)+w);});
  let map=ids.map((_,i)=>i);
  for(let pass=0;pass<12;pass++){
    const N=level.length, k=level.map(m=>{let s=0;m.forEach(w=>s+=w);return s;});
    const m2=k.reduce((a,b)=>a+b,0); if(!m2) break;
    const com=[...Array(N).keys()], tot=k.slice();
    let moved=true, any=false, guard=0;
    while(moved && guard++<60){
      moved=false;
      for(let i=0;i<N;i++){
        const ci=com[i], wc=new Map();
        level[i].forEach((w,j)=>{ if(j!==i) wc.set(com[j],(wc.get(com[j])||0)+w); });
        tot[ci]-=k[i];
        let best=ci, bestGain=(wc.get(ci)||0)-tot[ci]*k[i]/m2;
        wc.forEach((w,c)=>{ const g=w-tot[c]*k[i]/m2; if(g>bestGain+1e-9){bestGain=g;best=c;} });
        tot[best]+=k[i];
        if(best!==ci){com[i]=best; moved=true; any=true;}
      }
    }
    if(!any) break;
    const ren=new Map(); com.forEach(c=>{ if(!ren.has(c)) ren.set(c,ren.size); });
    const nc=com.map(c=>ren.get(c));
    const next=Array.from({length:ren.size},()=>new Map());
    level.forEach((m,i)=>m.forEach((w,j)=>{ const a=nc[i], b=nc[j]; next[a].set(b,(next[a].get(b)||0)+w); }));
    map=map.map(x=>nc[x]); level=next;
  }
  return new Map(ids.map((id,i)=>[id,map[i]]));
}

const colorOf = n=>{ const g=MODES[state.mode].groups().find(g=>g.k===MODES[state.mode].of(n)); return g?g.color:'var(--t-x)'; };

});

const edgeOn = e=> kindOn(e) && nodeOn(e.S) && nodeOn(e.T) && (state.util || (!isUtil(e.S)&&!isUtil(e.T)) || e.s===state.sel || e.t===state.sel);

const gClabels = root.append('g'), gEdges = root.append('g'), gNodes = root.append('g'), gLabels = root.append('g');
const baseRad = n => isBroken(n) ? 7 : 3.2 + Math.sqrt(n.inC + n.inT*0.4 + n.inI) * 1.35;
const rad = n => n.pil ? Math.max(baseRad(n), 13) : baseRad(n);

const RING = 430, OUTER = 780;
function ringAnchors(keys, r){ const out={}; keys.forEach((k,i)=>{ const a=-Math.PI/2 + i*2*Math.PI/keys.length; out[k]=[Math.cos(a)*r, Math.sin(a)*r]; }); return out; }
// related clusters sit next to each other around the ring
const TOPIC_RING = G.ring || TOPICS.map(t=>t.k).filter(k=>k!=='core');
const ANCH = {
  topic: ringAnchors(TOPIC_RING, RING),
  section: {core:[0,0], svc:[-0.05*RING*2.1,-0.62*RING*2.1], cond:[0.62*RING*2.1,-0.18*RING*2.1], sym:[0.32*RING*2.1,0.6*RING*2.1], blog:[-0.6*RING*2.1,0.36*RING*2.1], area:[-0.62*RING*2.1,-0.34*RING*2.1], video:[-0.2*RING*2.1,0.75*RING*2.1], review:[0.75*RING*2.1,0.25*RING*2.1], broken:[0.85*RING*2.1,0.55*RING*2.1]},

  const strength = mode==='links' ? .05 : mode==='topic' ? .012 : .035;

  const sim = d3.forceSimulation(P)
    .force('link', d3.forceLink(links).distance(55).strength(strength))

  const labels = [];

    d3.groups(P.filter(p=>!p.u), p=>of(p.n)).forEach(([k,ps])=>{

    });
  }
  return {pos, labels};
}

function neighbours(n){
  const set=new Set([n.id]);
  n.outs.forEach(e=>{ if(edgeOn(e)) set.add(e.t); });
  n.ins.forEach(e=>{ if(edgeOn(e)) set.add(e.s); });
  return set;
}
function mutualSet(n){
  const outs=new Set(n.outs.filter(edgeOn).map(e=>e.t));
  return new Set(n.ins.filter(edgeOn).map(e=>e.s).filter(s=>outs.has(s)));
}
function updateLabels(){
  const sel = state.sel ? byId.get(state.sel) : null;
  const nb = sel ? neighbours(sel) : null;
  const grouped = state.mode!=='section';
  labelSel.attr('display',n=>{
    if(!nodeOn(n)) return 'none';
    if(nb) return nb.has(n.id) && (n.id===sel.id || nb.size<=40 || k>1.3) ? null : 'none';
    if(isUtil(n) && !state.util && grouped) return k>1.8 ? null : 'none';
    if(n.pil && grouped) return null;
    if(!grouped && topHubs.has(n.id)) return null;
    if(k>2.2) return null;
    if(k>1.5 && (n.inC+n.inT)>=8) return null;
    return 'none';
  }).attr('class',n=>'label'+(n.pil&&state.mode!=='section'?' pil':'')+(n.pil||(sel&&n.id===sel.id)?'':' small'));
  clabelSel.attr('display',d=>state.mode!=='links'&&state.hidden[state.mode].has(d.k)?'none':null);
}
function applyFilters(){
  nodeSel.attr('display',n=>nodeOn(n)?null:'none');
  edgeSel.attr('display',e=>edgeOn(e)?null:'none');
  nodeSel.classed('util', n=>isUtil(n) && !state.util);
  highlight(); updateLabels();
  if(state.sel && byId.has(state.sel)) renderNode(byId.get(state.sel));
  if(state.view==='table') renderTable();
}
function highlight(){
  const sel = state.sel ? byId.get(state.sel) : null;
  root.classed('dim',!!sel);
  if(!sel){ nodeSel.classed('hl',false).classed('sel',false); edgeSel.classed('out',false).classed('in',false).classed('both',false); return; }
  const nb = neighbours(sel), mu = mutualSet(sel);
  nodeSel.classed('hl',n=>nb.has(n.id)).classed('sel',n=>n.id===sel.id);
  edgeSel.classed('out',e=>e.s===sel.id).classed('in',e=>e.t===sel.id)
    .classed('both',e=>(e.s===sel.id&&mu.has(e.t))||(e.t===sel.id&&mu.has(e.s)));
  edgeSel.filter(e=>e.s===sel.id||e.t===sel.id).raise();
}

function linkRow(e, dir){

  if(isBroken(e.T)) bits.push('page not found');

  return `<li>${dotN(other)}<div><button class="lk" data-go="${esc(other.id)}">${esc(other.t)}</button><span class="meta">${both?'<span class="both-tag">Both ways</span> · ':''}${a?a+' · ':''}${esc(bits.join(' · '))}</span></div></li>`;
}
function linkList(title, arr, dir, emptyText){
  const sorted=[...arr].sort((a,b)=>a.c===b.c? (dir==='out'?a.T.t:a.S.t).localeCompare(dir==='out'?b.T.t:b.S.t) : (a.c===1?-1:b.c===1?1:a.c-b.c));
  const first=sorted.slice(0,12).map(e=>linkRow(e,dir)).join('');
  const rest=sorted.slice(12).map(e=>linkRow(e,dir)).join('');
  return `<section><h3>${title}<span class="n">${arr.length}</span></h3>${arr.length?`<ul class="list">${first}</ul>${rest?`<details><summary>Show ${sorted.length-12} more</summary><ul class="list">${rest}</ul></details>`:''}`:`<p class="empty">${emptyText}</p>`}</section>`;
}
function ratio(a,b){ if(!b) return '<span class="ratio none">n/a</span>'; const low=a/b<0.6; return `<span class="ratio${low?' low':''}">${a}/${b}</span>`; }
function clusterTable(){

    <td>${tdot(`${TCOL[c.t.k]}`)} <button class="lk" data-go="${esc((c.pillar||c.members[0]).id)}">${esc(c.t.name)}</button>${c.pillar?'':'<div class="meta" style="font-size:12px;color:var(--ink-3)">No pillar page</div>'}</td>

  return `<section><h3>Topic clusters</h3><div style="overflow-x:auto"><table class="ctable"><thead><tr><th>Cluster</th><th class="num">Pages</th><th class="num">Up</th><th class="num">Down</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="empty" style="margin-top:6px">Up: cluster pages that link to their pillar. Down: cluster pages the pillar links to. Amber means under 60%.</p></section>`;
}
function commTable(){

function renderNode(n){
  const url = SITE + n.id;
  const ins = n.ins.filter(edgeOn), outs = n.outs.filter(edgeOn);
  const flags=[];
  const pil = pillarOf(n);
  if(isBroken(n)) flags.push('<span class="pill bad">Page not found (404)</span>');
  if(n.pil){ const c=CL[n.tp]; flags.push('<span class="pill ok">Pillar page</span>'); flags.push(`<span class="pill">Links down to ${c.down.length} of ${c.spokes.length} cluster pages</span>`); flags.push(`<span class="pill">${c.up.length} of ${c.spokes.length} link back up</span>`); }
  if(pil){ flags.push(linksTo(n,pil)?'<span class="pill ok">Links up to its pillar</span>':'<span class="pill warn">Doesn\'t link to its pillar</span>'); flags.push(linksTo(pil,n)?'<span class="pill">Pillar links here</span>':'<span class="pill">Pillar doesn\'t link here</span>'); }
  if(n.nav) flags.push('<span class="pill">In the menu or footer</span>');

  if(COMM[n.cm]){ const c=COMM[n.cm], tk=c.topic; commNote = `<p class="empty" style="margin:0">Link group: ${esc(c.name)}${tk!==n.tp?`. <span style="color:var(--warn)">Its links tie it most closely to ${esc(TOPIC[tk].name)} pages, not ${esc(TOPIC[n.tp].name)}.</span>`:'.'}</p>`; }

  <div><p class="eyebrow">${dotN(n)} ${esc(TYPES[n.g].one)} · ${tdot(`${TCOL[n.tp]}`)} ${esc(TOPIC[n.tp].name)}</p><h2>${esc(n.t)}</h2>

  ${commNote}
  ${curMutual.size?`<p class="empty" style="margin:0"><span class="both-tag">${curMutual.size} ${curMutual.size===1?'page links':'pages link'} both ways</span> with this one, shown in green on the map.</p>`:''}
  ${hidden?`<p class="empty">${hidden} more links are hidden by the filters above.</p>`:''}
  ${linkList('Pages linking here', ins, 'in', isBroken(n)?'':'No other page links here with the current filters.')}

  sugg.innerHTML=sItems.map((n,i)=>`<li role="option" id="s${i}" aria-selected="${i===0}" data-go="${esc(n.id)}">${dotN(n)} ${esc(n.t)}<small>${esc(n.id)}</small></li>`).join('') || '<li aria-disabled="true">No matching pages</li>';

  <p>Found by crawling every published page on ${esc(G.crawled)}. Menu and footer links are not counted here because they appear on every page.</p>
  ${brokenEdges.length ? issueBlock('bad', `Broken links <span class="n">${brokenEdges.length}</span>`, 'These links point to pages that return "not found." Point each one at the live page or remove it.', brokenList) : issueBlock('ok', 'Broken links <span class="n">0</span>', 'Every internal link points to a page that loads.')}
  ${redirectEdges.length ? issueBlock('warn', `Links that go through a redirect <span class="n">${redirectEdges.length} links, ${redirGroups.length} old URLs</span>`, 'They still work, but each one makes visitors and Google take an extra hop. Updating the link to the final URL is a quick win.', redirList) : issueBlock('ok', 'Links that go through a redirect <span class="n">0</span>', 'Every internal link points straight at its final URL.')}
  ${notUp.length ? issueBlock('warn', `Pages that don't link up to their pillar <span class="n">${notUp.length}</span>`, 'In a hub and spoke cluster every supporting page links back to its pillar. A short in-text link from each of these to the pillar is what ties the cluster together.', upList) : issueBlock('ok', 'Pages that don\'t link up to their pillar <span class="n">0</span>', 'Every page in a pillar cluster links back to its pillar.')}
  ${blogIndexOnly.length?issueBlock('info', `Blog posts only reachable from the blog index <span class="n">${blogIndexOnly.length}</span>`, 'No page or post links to these. Google can only find them by paging through the blog index.', pageItems(blogIndexOnly, n=>'blog index page '+idxPage(n))):''}
  ${issueBlock('info', `Other pages nothing links to <span class="n">${noInboundOther.length}</span>`, 'These pages get no links from other pages, only from the menu or footer if at all. Some are expected (legal pages, specials). Check the rest.', pageItems(noInboundOther, n=>n.nav?'in menu or footer':'not in the menu either'))}
  ${issueBlock('info', `Pages set to noindex <span class="n">${noindex.length}</span>`, 'Search engines are told not to list these. That is usually intentional for landing pages used in ads.', pageItems(noindex))}
  ${deadEnds.length?issueBlock('info', `Pages with no outgoing links <span class="n">${deadEnds.length}</span>`, 'Visitors who land here have nowhere to go except the menu.', pageItems(deadEnds)):''}
  `;
}
document.getElementById('issues').addEventListener('click',ev=>{const b=ev.target.closest('[data-go]'); if(b){ setView('map'); select(b.dataset.go,true);} });

/* ---------- table view ---------- */
let sortKey='in', sortDir=-1;
const cols=[
  {k:'t',label:'Page',num:false,val:n=>n.t},
  {k:'tp',label:'Topic',num:false,val:n=>TOPIC[n.tp].name},
  {k:'g',label:'Type',num:false,val:n=>TYPES[n.g].one},
  {k:'in',label:'Links in (written)',num:true,val:n=>n.inC},
  {k:'inT',label:'Links in (template)',num:true,val:n=>n.inT},
  {k:'out',label:'Links out (written)',num:true,val:n=>n.outC},
  {k:'up',label:'Links to pillar',num:false,val:n=>n.pil?'Pillar':(pillarOf(n)?(linksTo(n,pillarOf(n))?'Yes':'No'):'')},
  {k:'flags',label:'Flags',num:false,val:n=>[isBroken(n)?'404':'', n.ni?'noindex':'', (!isBroken(n)&&n.inC+n.inT===0)?'no links in':''].filter(Boolean).join(', ')}
];
function renderTable(){
  const rows=G.nodes.filter(nodeOn);
  const c=cols.find(c=>c.k===sortKey);
  rows.sort((a,b)=>{const x=c.val(a),y=c.val(b); return (c.num?x-y:String(x).localeCompare(String(y)))*sortDir;});
  document.getElementById('tbl').innerHTML=`<thead><tr>${cols.map(c=>`<th class="${c.num?'num':''}" aria-sort="${c.k===sortKey?(sortDir>0?'ascending':'descending'):'none'}"><button data-sort="${c.k}">${c.label}${c.k===sortKey?(sortDir>0?' ▲':' ▼'):''}</button></th>`).join('')}</tr></thead>
  <tbody>${rows.map(n=>`<tr class="clickable" data-go="${esc(n.id)}"><td><div>${esc(n.t)}</div><div class="path">${esc(n.id)}</div></td><td>${tdot(`${TCOL[n.tp]}`)} ${esc(TOPIC[n.tp].name)}</td><td>${dotN(n)} ${esc(TYPES[n.g].one)}</td><td class="num">${n.inC}</td><td class="num">${n.inT}</td><td class="num">${n.outC}</td><td>${esc(cols[6].val(n))}</td><td>${esc(cols[7].val(n))}</td></tr>`).join('')}</tbody>`;
}
document.getElementById('tbl').addEventListener('click',ev=>{
  const s=ev.target.closest('[data-sort]'); if(s){ const k=s.dataset.sort; if(k===sortKey) sortDir*=-1; else {sortKey=k; sortDir=cols.find(c=>c.k===k).num?-1:1;} renderTable(); return; }
  const r=ev.target.closest('[data-go]'); if(r){ setView('map'); select(r.dataset.go,true); }
});

/* ---------- views ---------- */
function setView(v){
  state.view=v;
  document.querySelectorAll('[role=tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===v));
  document.getElementById('map').hidden = v!=='map';
  document.getElementById('issuesView').hidden = v!=='issues';
  document.getElementById('tableView').hidden = v!=='table';
  document.getElementById('keylegend').hidden = !(state.sel && v==='map');
  if(v==='issues') renderIssues();
  if(v==='table') renderTable();
  if(v==='map') requestAnimationFrame(()=>{ const w=mapEl.clientWidth,h=mapEl.clientHeight; if(Math.abs(w-W)>2||Math.abs(h-H)>2){W=w;H=h;fit(false);} });
  try{ localStorage.setItem('lm-view',v);}catch(e){}
}
document.querySelectorAll('[role=tab]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
window.addEventListener('resize',()=>{ if(state.view!=='map') return; const w=mapEl.clientWidth,h=mapEl.clientHeight; if(w&&h){W=w;H=h;} });

document.querySelectorAll('#modeSeg button').forEach(b=>b.setAttribute('aria-checked',b.dataset.mode===state.mode));
buildChips(); renderMapNote(); applyFilters(); renderOverview(); fit(false);
let saved=null; try{ saved=localStorage.getItem('lm-view'); }catch(e){}
if(saved && saved!=='map') setView(saved);
})();
</script>
